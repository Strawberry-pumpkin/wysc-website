<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WYSC / SLIO 2024  </title>
  <link rel="shortcut icon" href="/static/images/wyclogo.png" type="image/x-icon">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.cdnfonts.com/css/franklin-gothic?styles=17611" rel="stylesheet">
  <link href="https://fonts.cdnfonts.com/css/ibm-plex-sans" rel="stylesheet">
  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>      


  <style>
    html{
      scroll-behavior: smooth;
    }
    a,h1,h2,h3{
      font-family: 'Franklin Gothic';

    }
    p{
      font-family: 'IBM Plex Sans', sans-serif;

    }
    .bg{
      clip-path: polygon(0 0, 100% 0%, 85% 100%, 0 100%);
    }
    @media (max-width:780px){
      .bg{
        clip-path: none;
      }
    }
  </style>
</head>
<body class="bg-gray-100">
    <div class="fixed top-0 left-0 right-0 bg-gray-50 shadow-md hidden z-50  h-100" id="navbar">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between items-center py-4 lg:justify-start lg:space-x-10">
          <div class="flex justify-start lg:w-0 lg:flex-1">
            <img id='citrus' src="/static/images/wyclogo.png" class="w-6" onmouseover='document.getElementById("citrus").src="https://www.srilankascrabbleleague.lk/static/citrus.png"' onmouseleave='document.getElementById("citrus").src="/static/images/wyclogo.png"'>&nbsp;
            <a href="/" class="text-gray-900 text-base font-medium hover:text-gray-600" style="color: #1e3653;">WYSC & SLIO <span class="text-orange-500">2024</span></a>&nbsp;
          </div>
          <nav class="lg:block hidden space-x-10" id="menu">
            <a href="/accounts/signup/" class="text-base font-medium text-gray-900 hover:text-orange-500 block lg:inline-block">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Register</a>
            <a href="/wysc" class="text-base font-medium text-gray-900 hover:text-orange-500 block lg:inline-block">WYSC</a>
            <a href="/slio" class="text-base font-medium text-gray-900 hover:text-orange-500 block lg:inline-block">SLIO</a>
            <a href="#faq" class="text-base font-medium text-gray-900 hover:text-orange-500 block lg:inline-block">FAQs</a>
            

          </nav>
          <button class="lg:hidden text-black">
            <ion-icon name="menu" id="menuBtn"></ion-icon>
          </button>
        </div>
      </div>


    </div>

          <div class="bg-card text-card-foreground p-4 rounded-lg shadow-lg mt-10">
            <h2 class="text-center text-2xl">Registered Players for WYSC 2024</h2><br>
            <div class="searcher mx-auto border-2 w-fit px-3 rounded-lg flex justify-center hover:border-black">
              <input type="text" placeholder="Search..." class="rounded-lg  px-4  outline-none bg-transparent  " oninput="search(this.value)">
              <ion-icon name="search" class="py-5"></ion-icon>
            </div>
            <div class="overflow-x-scroll lg:overflow-x-hidden">
          <table class=" divide-y divide-zinc-200 mx-auto mt-5 ">
              <thead>
                  <tr class="bg-gray-200">
                    <th></th>
                      
                      <th class="px-6 py-3  border-r-2">Name</th>
                      <th class="px-6 py-3  border-r-2">Country</th>
                      <th class="px-6 py-3 border-r-2  ">Status</th>
                  </tr>
              </thead>
              <tbody class="divide-y divide-zinc-200" id="plist">
                  <tr class="bg-green-300 ">
                    <td class="px-6 py-4 border-r-2">1</td>
                      
                      <td class="px-6 py-4 ">John Doe</td>
                      <td class="px-6 py-4">USA</td>
                      <td class="px-6 py-4">
                          Payment to be made
                      </td>
                      
                  </tr>
                  
              </tbody>
          </table>
      </div></div>
      
      

    
  <footer class="bg-gray-300 text-black  text-center py-4">
    <p>&copy;WYSC & SLIO 2024</p>
    <div class="flex justify-center mt-2">
      <a

        href="mailto:wysc2024@scrabble.lk"
        class="text-black  mx-2 hover:text-gray-800 dark:hover:text-gray-800"
      ><ion-icon name="mail"></ion-icon>
      </a>
      <a

        href="https://www.facebook.com/ScrabbleFederationSL" target="_blank"
        class="text-black  mx-2 hover:text-gray-800 dark:hover:text-gray-800"
      >
      <ion-icon name="logo-facebook"></ion-icon>
      </a>
      <a

        href="https://www.instagram.com/scrabblefederationsl/" target="_blank"
        class="text-black  mx-3 hover:text-gray-400 dark:hover:text-gray-800"
      ><ion-icon name="logo-instagram"></ion-icon>
      </a>
      <a

        href="https://www.youtube.com/@scrabblefederationsl/" target="_blank"
        class="text-black  mx-3 hover:text-gray-400 dark:hover:text-gray-800"
      ><ion-icon name="logo-youtube"></ion-icon>
      </a>
    </div>
  </footer>


  <button id="scrollToTop" class="fixed bottom-4 right-4 bg-orange-500 text-white p-2 rounded-full shadow-lg hover:bg-orange-600 z-50 hidden">
    ↑
  </button>
  

  <script>
    

const navbar = document.getElementById('navbar');
    // navbar of wysc.html
window.addEventListener('scroll', () => {
  if (window.scrollY > 0) {
  
  navbar.classList.remove('hidden')
  
  } else {
  
  navbar.classList.add('hidden')
  }
  });
  



// responsive navbar for both
const menuBtn = document.getElementById('menuBtn');
const menu = document.getElementById('menu');

menuBtn.addEventListener('click', () => {
  menu.classList.toggle('hidden');
  if (menuBtn.name=='menu'){
      menuBtn.name='close'
  }
  else{
      menuBtn.name = 'menu'
  }
});
      const faq = document.getElementById(`faq-${index}`);
      const faqbut = document.getElementById(`bt${index}`)
      // b1,b2,b3.. is for carousel // 
      //bt0,bt1,bt2... is for faq//

      if (faqbut.name == 'arrow-down'){
        faqbut.name = 'arrow-up'
      }
      else{
        faqbut.name = 'arrow-down'
      }
      faq.classList.toggle('hidden');
      faq.classList.toggle('block');
    


      function search(val){
        console.log(val)
        const ppl = document.getElementById('plist').childNodes
        if (val == ''){
          for (let i=1; i<ppl.length; i+=2){
            ppl[i].classList.remove('hidden')
          }
                  }
        else{
                    
        for (let i=1; i<ppl.length; i+=2){
          name = ppl[i].childNodes[3].innerHTML.toUpperCase()
          console.log(name)
          if (name.includes(val.toUpperCase())){
            ppl[i].classList.remove('hidden')
          }
          else{
            ppl[i].classList.add('hidden')
          }
          
        }
        
      }
    }
  </script>
  
  
</body>
</html>
